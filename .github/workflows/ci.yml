name: CI

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'docs/**'
      - 'chore/**'
  pull_request:
    branches: [main]

# One run per branch: a new push cancels the in-flight run instead of
# queueing N parallel runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      # `check` already ends with a full build (npm-run-all --serial build),
      # so no separate build step.
      - run: npm run check

  actionlint:
    name: Lint workflows (actionlint)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Download actionlint v1.7.12 (SHA-pinned)
        run: |
          ACTIONLINT_VERSION="1.7.12"
          ACTIONLINT_SHA256="8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
          curl -sSL \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            -o actionlint.tar.gz
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf actionlint.tar.gz actionlint
          chmod +x actionlint

      - name: Run actionlint
        run: |
          ./actionlint -color .github/workflows/*.yml

      - name: Scan for unpinned third-party action refs (mutable @branch refs)
        run: |
          UNPINNED=$(grep -rnE "^[[:space:]]*-?[[:space:]]*uses:[[:space:]]+" \
              .github/workflows/*.yml \
            | sed -E 's/#.*$//' \
            | grep -vE "uses:[[:space:]]+(actions/|github/|\\./)" \
            | grep -vE "@[0-9a-f]{40}[[:space:]]*$" \
            || true)
          if [ -n "$UNPINNED" ]; then
            echo "ERROR: unpinned third-party action refs found:"
            echo "$UNPINNED"
            exit 1
          fi
          echo "OK: all third-party action refs appear to be SHA-pinned."
